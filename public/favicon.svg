<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141C28" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E59B63" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#9D613C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="uGrad" x1="13" y1="15" x2="39" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBEEE0" />
      <stop offset="100%" stop-color="#DEC6B0" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="43" y1="40" x2="52" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E59B63" />
      <stop offset="100%" stop-color="#9D613C" />
    </linearGradient>
  </defs>

  <!-- Hardware Module Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#rim)" stroke-width="2" />

  <!-- Subtle Recessed Inner Panel -->
  <rect x="6" y="6" width="52" height="52" rx="9" fill="#0B0F17" fill-opacity="0.55" />

  <!-- Architectural Chamfered 'U' Monogram (Uray Fazli) -->
  <path
    d="M13 15H22V40H30V15H39V42L32 49H20L13 42V15Z"
    fill="url(#uGrad)"
  />

  <!-- Telemetry Bus Line Connecting Node Diode to Terminal Block -->
  <line x1="47.5" y1="25" x2="47.5" y2="37" stroke="#9D613C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2.5 3.5" />

  <!-- Live Validator Node LED Diode (Top Right) -->
  <circle cx="47.5" cy="19.5" r="6" fill="#22C55E" fill-opacity="0.2" />
  <circle cx="47.5" cy="19.5" r="4" fill="#22C55E" />
  <circle cx="46.2" cy="18.2" r="1.2" fill="#DCFCE7" />

  <!-- CLI Terminal Prompt Block '_' (Bottom Right) -->
  <path
    d="M43 40H52V46.5L49.5 49H43V40Z"
    fill="url(#amberGrad)"
  />
</svg>
