<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    Anti-AI-Slop Precision Emblem Favicon — Uray Fazli Alman (Validator Node & Celestial Orrery)
    Engineered on a pixel-aligned 64x64 grid with high-contrast flat ink planes for 16px/32px clarity.
  -->

  <!-- Outer Obsidian Hardware Bezel -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B1018" stroke="#FBEEE0" stroke-width="2.5" />
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#121A26" stroke="#9D613C" stroke-width="1.2" stroke-dasharray="4 3" />

  <!-- Back Half of Tilted Planetary Ring (Behind Isometric Node Core) -->
  <g transform="rotate(-24 32 32)">
    <path
      d="M 7 32 A 25 9.5 0 0 1 57 32"
      stroke="#9D613C"
      stroke-width="2.2"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Center Isometric Validator Genesis Block (3-Plane Architectural Cube) -->
  <!-- Top Rhombus Face -->
  <polygon
    points="32,15 46,23 32,31 18,23"
    fill="#FBEEE0"
    stroke="#0B1018"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <!-- Left Isometric Face -->
  <polygon
    points="18,23 32,31 32,47 18,39"
    fill="#E59B63"
    stroke="#0B1018"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <!-- Right Isometric Face -->
  <polygon
    points="32,31 46,23 46,39 32,47"
    fill="#9D613C"
    stroke="#0B1018"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Front Half of Tilted Planetary Ring (Crosses in front of Isometric Core) -->
  <g transform="rotate(-24 32 32)">
    <path
      d="M 57 32 A 25 9.5 0 0 1 7 32"
      stroke="#FBEEE0"
      stroke-width="2.6"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M 53 34.5 A 22 8 0 0 1 11 34.5"
      stroke="#E59B63"
      stroke-width="1.4"
      stroke-dasharray="3 3"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Orbiting Planet on the Ring -->
    <circle cx="11" cy="34.5" r="4.2" fill="#E59B63" stroke="#0B1018" stroke-width="1.8" />
    <circle cx="10" cy="33.5" r="1.2" fill="#FBEEE0" />
  </g>

  <!-- Active Consensus Emerald Telemetry Node (Top-Right Satellite) -->
  <circle cx="49" cy="15" r="4.5" fill="#22C55E" stroke="#0B1018" stroke-width="2" />
  <circle cx="47.8" cy="13.8" r="1.2" fill="#DCFCE7" />
</svg>
