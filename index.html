    <script>
      // Defensive guard against browser wallet extension conflicts (e.g. "Cannot redefine property: ethereum")
      (function () {
        try {
          var _eth = window.ethereum;
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function () {
              return _eth;
            },
            set: function (val) {
              _eth = val;
            }
          });
        } catch (e) {}

        window.addEventListener('error', function (event) {
          if (event && event.message && (event.message.indexOf('ethereum') !== -1 || event.message.indexOf('Cannot redefine property') !== -1)) {
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);
      })();
    </script>
    <script type="text/javascript">
      // GitHub Pages SPA redirect handler
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
