    <script>
      (function () {
        try {
          var walletProps = {
            ethereum: true,
            web3: true,
            solana: true,
            aptos: true,
            petra: true,
            martian: true,
            pontem: true,
            sei: true,
            compass: true,
            leap: true,
            keplr: true,
            phantom: true
          };

          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (target, prop, descriptor) {
            if (target === window && walletProps[String(prop)]) {
              try {
                var existing = Object.getOwnPropertyDescriptor(window, prop);
                if (existing && existing.configurable === false) {
                  return target;
                }
                var safeDescriptor = Object.assign({}, descriptor, {
                  configurable: true
                });
                return origDefineProperty.call(Object, target, prop, safeDescriptor);
              } catch (_err) {
                return target;
              }
            }
            try {
              return origDefineProperty.call(Object, target, prop, descriptor);
            } catch (err) {
              if (
                err instanceof TypeError &&
                String(err.message || '').indexOf('Cannot redefine property') !== -1
              ) {
                return target;
              }
              throw err;
            }
          };

          window.addEventListener(
            'error',
            function (event) {
              var msg = String((event && event.message) || '');
              if (
                msg.indexOf('Cannot redefine property: ethereum') !== -1 ||
                msg.indexOf('Cannot redefine property') !== -1 ||
                msg.indexOf('Cannot set property ethereum') !== -1
              ) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return false;
              }
            },
            true
          );
        } catch (_e) {}
      })();
    </script>
